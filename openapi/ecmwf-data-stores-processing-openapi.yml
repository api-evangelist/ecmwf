openapi: 3.1.0
info:
  title: ECMWF Data Stores Processing API
  description: 'This REST API service enables the submission of processing tasks (data
    retrieval) to the ECMWF Data Stores system, and their consequent monitoring and
    management. The service is based on the [OGC API - Processes standard](https://ogcapi.ogc.org/processes/).


    Being based on the OGC API - Processes standard, some terminology is inherited
    from it. In the context of this specific API, each _process_ is associated with
    a specific dataset and enables the retrieval of data from that dataset: as such,
    each _process_ identifier corresponds to a specific dataset identifier.

    A _job_, instead, is a specific data retrieval task that has been submitted for
    execution.'
  version: 0.1.0
paths:
