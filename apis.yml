aid: ecmwf

name: ECMWF

description: ECMWF, the European Centre for Medium-Range Weather Forecasts, is an intergovernmental organisation that is both a research institute
  and a 24/7 operational service, producing global numerical weather predictions and other data for its Member and Co-operating States and the
  broader community. It operates one of the largest supercomputer facilities and meteorological data archives in the world, and offers programmatic
  data access through the ECMWF Web API and its Free & Open Data portal.

