note: >-
  ECMWF is an intergovernmental organisation; its privacy statement says GDPR does not directly
  apply and that it provides similar safeguards through its PIIP. The accessibility page
  (https://www.ecmwf.int/en/accessibility, 200) only advises users to change their own browser
  settings and states no conformance standard, so accessibility_conformance is not recorded.
  The terms of use describe forum moderation but no content-reporting mechanism, so
  notice_and_action is not recorded. The privacy statement names categories of partners but
  publishes no subprocessor list.
